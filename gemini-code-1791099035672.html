<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Free Domain & Web Publisher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-xl p-8 shadow-2xl">
    <h1 class="text-3xl font-bold text-center text-blue-400 mb-2">Claim Free Subdomain</h1>
    <p class="text-slate-400 text-center mb-6 text-sm">Publish your website with raw HTML, ZIP file, or custom IP pointing.</p>

    <form id="hostForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Subdomain Name</label>
        <div class="flex">
          <input type="text" id="subdomain" required placeholder="mysite" class="w-full bg-slate-900 border border-slate-700 rounded-l-lg p-3 text-white focus:outline-none focus:border-blue-500">
          <span class="bg-slate-700 px-4 flex items-center rounded-r-lg text-slate-300 border border-l-0 border-slate-700">.yourdomain.com</span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Deployment Mode</label>
        <select id="mode" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
          <option value="html">Paste Raw HTML Code</option>
          <option value="file">Upload Static Zip File</option>
          <option value="ip">Point to External IP (A Record)</option>
        </select>
      </div>

      <!-- HTML Mode input -->
      <div id="htmlGroup">
        <label class="block text-sm font-medium mb-1">HTML Code</label>
        <textarea id="htmlContent" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-mono text-xs focus:outline-none focus:border-blue-500" placeholder="<h1>Hello World!</h1>"></textarea>
      </div>

      <!-- File Mode input -->
      <div id="fileGroup" class="hidden">
        <label class="block text-sm font-medium mb-1">ZIP File (contains index.html)</label>
        <input type="file" id="zipFile" accept=".zip" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-300">
      </div>

      <!-- IP Mode input -->
      <div id="ipGroup" class="hidden">
        <label class="block text-sm font-medium mb-1">Target IP Address</label>
        <input type="text" id="targetIp" placeholder="192.0.2.1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold p-3 rounded-lg transition duration-200">Register & Deploy Website</button>
    </form>

    <div id="responseMsg" class="mt-4 p-4 rounded-lg hidden"></div>
  </div>

  <script>
    const modeSelect = document.getElementById('mode');
    const htmlGroup = document.getElementById('htmlGroup');
    const fileGroup = document.getElementById('fileGroup');
    const ipGroup = document.getElementById('ipGroup');

    modeSelect.addEventListener('change', () => {
      htmlGroup.classList.toggle('hidden', modeSelect.value !== 'html');
      fileGroup.classList.toggle('hidden', modeSelect.value !== 'file');
      ipGroup.classList.toggle('hidden', modeSelect.value !== 'ip');
    });

    document.getElementById('hostForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('subdomain', document.getElementById('subdomain').value);
      formData.append('mode', modeSelect.value);
      
      if (modeSelect.value === 'html') {
        formData.append('htmlContent', document.getElementById('htmlContent').value);
      } else if (modeSelect.value === 'file') {
        formData.append('zipFile', document.getElementById('zipFile').files[0]);
      } else if (modeSelect.value === 'ip') {
        formData.append('targetIp', document.getElementById('targetIp').value);
      }

      const res = await fetch('/api/register', { method: 'POST', body: formData });
      const data = await res.json();
      const msgBox = document.getElementById('responseMsg');
      msgBox.classList.remove('hidden', 'bg-red-900', 'bg-green-900');

      if (data.success) {
        msgBox.classList.add('bg-green-900');
        msgBox.innerHTML = `Success! Your website is live at: <a href="${data.url}" target="_blank" class="underline text-blue-300">${data.url}</a>`;
      } else {
        msgBox.classList.add('bg-red-900');
        msgBox.textContent = `Error: ${data.error}`;
      }
    });
  </script>
</body>
</html>
